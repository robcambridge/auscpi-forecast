name: collect

# Daily collection. The point of running this in Actions rather than on your
# laptop is that it keeps running while you are asleep, in exams, or on holiday,
# and every run leaves a public commit proving the data was captured that day.
#
# Caveat worth knowing before you rely on it: retailer sites frequently block
# datacentre IP ranges, so grocery scrapers will likely fail here even when they
# work locally. Run API-based sources (FuelCheck, ABS) in Actions and keep the
# retail scrapers on a machine with a residential IP.

on:
  schedule:
    - cron: "0 20 * * *"    # 06:00 AEST / 07:00 AEDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Collect
        env:
          FUELCHECK_API_KEY: ${{ secrets.FUELCHECK_API_KEY }}
          FUELCHECK_API_SECRET: ${{ secrets.FUELCHECK_API_SECRET }}
        run: auscpi collect --all

      - name: Commit snapshots
        run: |
          git config user.name  "auscpi-bot"
          git config user.email "actions@github.com"
          git add data/raw
          git diff --staged --quiet || git commit -m "data: collection $(date -u +%Y-%m-%d)"
          git push

      # Deliberately AFTER the commit, so a stalled source still gets whatever data
      # this run did collect. This is the step that makes "runs unattended" checkable
      # rather than assumed: it fails the workflow when any source has gone past its
      # cadence, which is the only way a silent collector gets noticed before the gap
      # is months wide. data/raw is committed, so the checkout carries every
      # manifest and this sees all sources, not just the daily ones.
      - name: Check every source is within its cadence
        run: auscpi health --strict
