[project]
name = "auscpi"
version = "0.1.0"
description = "Real-time bottom-up nowcast of the Australian monthly CPI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    # NSW publishes bond lodgements only as .xlsx; pandas cannot read one without it.
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.3",
]

[project.optional-dependencies]
model = [
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
auscpi = "auscpi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auscpi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
