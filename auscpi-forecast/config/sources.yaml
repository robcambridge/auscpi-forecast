# Declarative source registry. The collector classes are the source of truth for
# behaviour; this file is for scheduling metadata and human documentation.

sources:
  fuelcheck:
    enabled: true
    cadence: daily
    run_at_utc: "20:00"        # 06:00 AEST
    backfillable: true         # archives on data.nsw.gov.au
    expenditure_classes: [automotive_fuel]
    basket_weight_pct: 3.5

  abs_cpi_monthly:
    enabled: false             # enable once the dataflow id is confirmed
    cadence: monthly
    run_after: release_calendar
    backfillable: true
    expenditure_classes: [all]

  sqm_rents:
    enabled: false             # RULED OUT — SQM's Terms of Service prohibit automated
                               # access. Collector is hard-disabled and raises if run.
                               # See docs/DATA_SOURCES.md, "Sources ruled out".
    cadence: weekly
    backfillable: false
    expenditure_classes: [rents]
    basket_weight_pct: 6.0
    replaced_by: nsw_rental_bonds

  nsw_rental_bonds:
    enabled: false             # implemented. Excluded from the DAILY `collect --all`
                               # because it is monthly, not because it is restricted —
                               # runs via .github/workflows/collect-monthly.yml.
    cadence: monthly           # NSW Fair Trading publishes lodgement files monthly
    backfillable: true         # .xlsx archives back to Jan 2021, so no rush
    expenditure_classes: [rents]
    basket_weight_pct: 6.0
    note: >-
      New-lease rents by postcode (weekly rent, dwelling type, bedrooms), lodged
      at tenancy commencement. CC-BY. Leads ABS measured rents by 6-12 months,
      which is the rent roll-through input. NSW only — estimate the
      NSW-to-national gap as with FuelCheck.

  grocery_basket:
    enabled: false             # not yet implemented — Phase 1
    cadence: daily
    backfillable: false        # START THIS EARLY
    expenditure_classes: [food_and_non_alcoholic_beverages]
    basket_weight_pct: 17.0

  # --- forecast-specific sources (Phase 4), not yet implemented ---

  rba_smp_forecasts:
    enabled: false
    cadence: quarterly
    backfillable: true
    role: benchmark            # the only benchmark that really matters
    note: Manual entry is fine. Four numbers a quarter.

  abs_wpi:
    enabled: false
    cadence: quarterly
    backfillable: true
    role: driver
    drives: [services_inflation]

  fuel_forward_curve:
    enabled: false
    cadence: daily
    backfillable: false
    role: driver
    drives: [automotive_fuel]
    note: Refined product futures + AUD forwards + known excise indexation.

  aud_forwards:
    enabled: false
    cadence: daily
    backfillable: true
    role: driver
    drives: [tradables]
